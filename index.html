<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LithoVox — ProjectManager</title>
  </head>
  <body>
    <div id="app" class="app">
      <header class="topbar">
        <div class="brand">
          <img class="brand-logo" src="/logo.png" alt="LithoVox" />
          <span class="brand-title">
            <span class="brand-litho">Litho</span><span class="brand-vox">Vox</span>
          </span>
          <span class="brand-sub">ProjectManager</span>
        </div>

        <nav class="view-tabs">
          <a class="view-tab" href="#/map" data-view="map">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21" /><line x1="9" y1="3" x2="9" y2="18" /><line x1="15" y1="6" x2="15" y2="21" />
            </svg>
            <span data-i18n="nav.map"></span>
          </a>
          <a class="view-tab" href="#/tables" data-view="tables">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" /><line x1="3" y1="9" x2="21" y2="9" /><line x1="3" y1="15" x2="21" y2="15" /><line x1="9" y1="9" x2="9" y2="21" />
            </svg>
            <span data-i18n="nav.tables"></span>
          </a>
        </nav>

        <div class="topbar-actions">
          <button class="toolbar-btn btn-danger" id="new-project-btn" data-i18n-title="project.new">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
            </svg>
          </button>
          <div class="toolbar-divider"></div>
          <button class="toolbar-btn" id="save-project-btn" data-i18n-title="project.save">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" /><polyline points="17 21 17 13 7 13 7 21" /><polyline points="7 3 7 8 15 8" />
            </svg>
          </button>
          <button class="toolbar-btn" id="load-project-btn" data-i18n-title="project.load">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" />
            </svg>
          </button>
          <input type="file" id="project-input" accept="application/json,.json" hidden />
          <div class="toolbar-divider"></div>
          <button type="button" id="theme-switch-btn" class="theme-switch" role="switch">
            <span class="theme-switch-track">
              <span class="theme-switch-thumb"></span>
            </span>
          </button>
        </div>
      </header>

      <div class="body">
        <!-- Left menu: shared by all views. -->
        <aside class="sidebar" id="sidebar">
          <label class="toolbar-btn file-btn sidebar-btn" data-i18n-title="referenceLine.uploadTitle">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" /><polyline points="16 7 22 7 22 13" />
            </svg>
            <span data-i18n="referenceLine.upload"></span>
            <input type="file" id="referenceline-input" accept=".shp,.shx,.dbf" multiple hidden />
          </label>
        </aside>

        <main class="content">
          <section class="view view-map" id="view-map">
            <div class="map" id="map"></div>
          </section>

          <section class="view view-tables" id="view-tables">
            <div class="placeholder">
              <h2 data-i18n="tables.title"></h2>
              <p class="hint" data-i18n="tables.comingSoon"></p>
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- Used both after uploading a referenceline and when clicking one on the map. -->
    <div id="referenceline-modal" class="modal-overlay">
      <form id="referenceline-modal-form" class="modal-card" novalidate>
        <h2 class="modal-title-row">
          <span class="line-swatch" id="referenceline-modal-swatch"></span>
          <span id="referenceline-modal-title"></span>
        </h2>
        <p class="hint" data-i18n="referenceLine.nameDialogHint"></p>
        <div class="modal-field">
          <label for="referenceline-modal-name" data-i18n="referenceLine.nameLabel"></label>
          <input type="text" id="referenceline-modal-name" autocomplete="off" />
          <p class="modal-error" id="referenceline-modal-error" role="alert"></p>
        </div>
        <label class="modal-checkbox">
          <input type="checkbox" id="referenceline-modal-chainage" />
          <span data-i18n="referenceLine.isChainageLine"></span>
        </label>
        <p class="hint modal-checkbox-hint" id="referenceline-modal-chainage-hint"></p>
        <div class="modal-actions">
          <button type="button" id="referenceline-modal-cancel" class="toolbar-btn" data-i18n="common.cancel"></button>
          <button type="submit" class="toolbar-btn primary-btn" data-i18n="common.save"></button>
        </div>
      </form>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
